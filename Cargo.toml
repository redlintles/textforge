[package]
name = "textforge"
version = "0.4.0"
edition = "2024"
description = "A Flexible scalable DSL that allows the creation of pipelines for text processing"
license-file = "LICENSE"
repository = "https://github.com/redlintles/textforge"
documentation = "https://docs.rs/textforge"
readme = "README.md"
rust-version = "1.89"
# Binaries are listed below (`txf`, `txfg`); the placeholders in src/bin are not programs.
autobins = false
keywords = ["text", "dsl", "pipeline", "text-processing", "transform"]
categories = ["text-processing", "command-line-utilities"]
# Only what builds the crate and documents it: benchmarks, data sets, scripts
# and bindings stay in the repository.
include = [
  "/src/**/*.rs",
  "/src/bin/txfg/games/*.json",
  "!/src/bindings/**",
  "/docs/txfrc.schema.json",
  "/README.md",
  "/changelog.md",
  "/LICENSE",
]

[dependencies]
unicode-normalization = "0.1.26"
tempfile = { version = "3.27.0", optional = true }
colored = { version = "3.0.0" }
regex = "1.11.1"
uuid = { version = "1.29.2", features = ["v4"] }
urlencoding = "2.1.3"
html-escape = "0.3.1"
serde_json = "1.0.154"
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.6.7", optional = true }
rayon = "1.12.0"
evalexpr = "13.1.0"

[dev-dependencies]
# Reference for the differential tests of src/text/line_parser.rs.
shell-words = "1.1.0"

[lib]
name = "textforge"
crate-type = ["rlib"]

[features]

default = []
bytecode = []
watchers = []
buffered = ["tempfile"]
# The `txf` command-line program and its helpers (`utils::cli`). It reads and
# writes bytecode and runs watchers, so it turns those features on (neither
# adds a dependency).
cli = ["dep:clap", "bytecode", "watchers"]
# The `txfg` game (src/bin/txfg). Dependencies only the game needs go here.
game = ["dep:clap"]

test_access = [
  "default",
  "bytecode",
  "buffered",
  "tempfile",
  "watchers",
  "cli",
  "game",
]

[[bin]]
name = "txf"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "txfg"
path = "src/bin/txfg/main.rs"
required-features = ["game"]


[workspace]
exclude = [
  "src/bindings/python",
  "src/bindings/node",
  "src/bindings/textforge_c",
]
resolver = "3"

[[example]]
name = "allocation_benchmark"
required-features = ["test_access"]

[package.metadata.docs.rs]
features = ["bytecode", "watchers", "buffered", "cli"]
rustdoc-args = ["--cfg", "docsrs"]
